name: wswd-prod

x-common-hardening: &common-hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-node-hardening: &node-hardening
  <<: *common-hardening
  init: true
  tmpfs:
    - /tmp

services:
  db:
    <<: *common-hardening
    image: postgres:17-alpine
    user: postgres
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    networks:
      - backend
    restart: unless-stopped

  migrate:
    <<: *node-hardening
    image: wswd-api:${APP_VERSION:?APP_VERSION is required}
    env_file: .env.prod
    command: ['node', 'dist/db/migrate.js']
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - backend
    restart: 'no'

  api:
    <<: *node-hardening
    image: wswd-api:${APP_VERSION:?APP_VERSION is required}
    env_file: .env.prod
    environment:
      APP_VERSION: ${APP_VERSION}
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 256m
    pids_limit: 200
    networks:
      - backend
      - edge
    restart: unless-stopped

  caddy:
    <<: *common-hardening
    image: wswd-web:${APP_VERSION:?APP_VERSION is required}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/healthz']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    pids_limit: 200
    networks:
      - edge
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
