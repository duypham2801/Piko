name: wswd-dev

services:
  db:
    image: postgres:17-alpine
    env_file: .env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5433:5432'

  install:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    env_file: .env.dev
    working_dir: /repo
    volumes: &dev-volumes
      - .:/repo
      - nm-root:/repo/node_modules
      - nm-web:/repo/apps/web/node_modules
      - nm-api:/repo/apps/api/node_modules
      - nm-domain:/repo/packages/domain/node_modules
      - pnpm-store:/pnpm/store
    command: pnpm install --frozen-lockfile

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    env_file: .env.dev
    working_dir: /repo
    volumes: *dev-volumes
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    command: sh -c 'pnpm --filter @wswd/api db:migrate && pnpm --filter @wswd/api dev'
    ports:
      - '127.0.0.1:8787:8787'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    env_file: .env.dev
    environment:
      API_PROXY_TARGET: http://api:8787
    working_dir: /repo
    volumes: *dev-volumes
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: pnpm --filter @wswd/web dev
    ports:
      - '127.0.0.1:5173:5173'

volumes:
  pgdata:
  pnpm-store:
  nm-root:
  nm-web:
  nm-api:
  nm-domain:
